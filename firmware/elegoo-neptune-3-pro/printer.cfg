# =============================================================================
#  TEMPLATE - Elegoo Neptune 3 Pro (ZNP Robin Nano DW v2.2 / STM32F401)
#  Klipper 0.13 / KlipPocket
# =============================================================================
#
#  Como usar:
#   1. Copie este arquivo para o editor de config da instancia (ou cole o
#      conteudo).
#   2. AJUSTE A SECAO [mcu] (veja o bloco marcado abaixo) - ela muda de aparelho
#      para aparelho / placa para placa.
#   3. NAO adicione [virtual_sdcard] - o app injeta sozinho, com o caminho certo.
#   4. Os valores de PID, z_offset e bed_mesh no bloco "#*# SAVE_CONFIG" no fim
#      sao exemplos; rode PID_HOTEND / PID_BED / G29 e o Klipper regrava esse
#      bloco com os seus.
#
# Recursos "novos" do Klipper 0.13 usados aqui:
#  - Bed mesh ADAPTATIVO  (BED_MESH_CALIBRATE ADAPTIVE=1) -> so sonda a area
#    ocupada pela peca. Precisa de [exclude_object] + o slicer emitindo
#    EXCLUDE_OBJECT_DEFINE (OrcaSlicer: liga sozinho; PrusaSlicer/SuperSlicer:
#    ative "Label objects"; Cura: plugin "Klipper Print Area Mesh"/exclude).
#  - minimum_cruise_ratio  (substitui o antigo max_accel_to_decel).
#  - [gcode_arcs]  -> suporte a G2/G3 (arcos), varios slicers ja emitem.
#  - Cancelamento de objeto via [exclude_object] (a UI Mainsail/Fluidd cuida).

[pause_resume]

[display_status]

[exclude_object]

# Detecta passo perdido via endstop (usado pelas macros SPEED_LIMIT TEST=1 e
# TEST_SPEED abaixo). Ver docs/mods/klipper-addons.md.
[auto_speed]
margin: 20

[gcode_arcs]
resolution: 0.5

[idle_timeout]
timeout: 1800


# -----------------------------------------------------------------------------
# >>> AJUSTE POR APARELHO <<<  MCU
# -----------------------------------------------------------------------------
# O KlipPocket IGNORA o valor de 'serial:' e auto-detecta a porta USB do
# aparelho - mas o Klipper exige que a linha exista e seja valida. Deixe uma
# referencia (a do bootloader/USB-serial da SUA placa) para portabilidade.
# 'restart_method: command' vale para praticamente todas as placas ARM.
# Placas diferentes: troque tambem os pinos das secoes [stepper_*], [extruder],
# [heater_bed], [fan], [probe] etc. mais abaixo.
[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5
# Klipper 0.13: 'max_accel_to_decel' foi trocado por 'minimum_cruise_ratio'.
# 0.5 = padrao. 0 desativa (movimento sempre acelera/desacelera 100%).
minimum_cruise_ratio: 0.5


# -----------------------------------------------------------------------------
# Motores
# -----------------------------------------------------------------------------

[stepper_x]
step_pin: !PC12
dir_pin: PB3
enable_pin: !PD2
microsteps: 16
rotation_distance: 40
endstop_pin: PA13
position_endstop: -6.0
position_min: -6
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PC11
dir_pin: PA15
enable_pin: !PC10
microsteps: 16
rotation_distance: 40
endstop_pin: PB8
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PC7
dir_pin: !PC9
enable_pin: !PC8
rotation_distance: 8
microsteps: 16
position_min: -2
position_max: 280
endstop_pin: probe:z_virtual_endstop
homing_speed: 5


# -----------------------------------------------------------------------------
# Sensor de nivelamento e homing seguro
# -----------------------------------------------------------------------------

[probe]
pin: PA8
x_offset: -28.5
y_offset: 22
# ---------------------------------------------------------------------------
# z_offset: PLACEHOLDER. O Klipper 0.13 recusa [probe] sem esta linha e trava
# a impressora inteira (nenhuma macro funciona). 1.5 e um chute seguro para a
# sonda indutiva da Neptune 3 Pro (~0.8 a 2.0).
#
# NAO e um override permanente: assim que voce roda PAPER_TEST / CALIBRATE_PROBE_Z
# e depois SAVE_CONFIG, o Klipper AUTOMATICAMENTE comenta esta linha (vira
# "#z_offset: 1.5") e passa a usar o valor calibrado do bloco "#*# SAVE_CONFIG"
# no fim do arquivo. Se voce ja calibrou antes e quer o seu valor JA valendo,
# troque o 1.5 pelo seu numero, ou rode SAVE_CONFIG uma vez.
# ---------------------------------------------------------------------------
z_offset: 1.5

[safe_z_home]
# Coloca o sensor, e nao o bico, no centro 117.5,117.5 da mesa.
home_xy_position: 146,95.5
speed: 80
z_hop: 10
z_hop_speed: 10


# -----------------------------------------------------------------------------
# Extrusora e aquecedores
# -----------------------------------------------------------------------------

[extruder]
max_extrude_only_distance: 100.0
step_pin: PB10
dir_pin: PB1
enable_pin: !PC6
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA6
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
min_temp: 0
max_temp: 270
# control/pid do hotend sao preenchidos pelo bloco SAVE_CONFIG (PID_HOTEND).
# pressure_advance so depois de calibrar (use SET_PA ou o macro CALIBRATE_PA).

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
pwm_cycle_time: 0.020
min_temp: 0
max_temp: 110
control: pid
pid_Kp: 64.230
pid_Ki: 0.723
pid_Kd: 1425.905
max_power: 0.80


# -----------------------------------------------------------------------------
# Ventiladores e iluminacao
# -----------------------------------------------------------------------------

[heater_fan hotend_fan]
pin: PB0
heater: extruder
heater_temp: 50.0

[fan]
pin: PA7

[output_pin LED_Light]
pin: PB9
pwm: False
value: 1
shutdown_value: 0


# -----------------------------------------------------------------------------
# Sensor de filamento
# -----------------------------------------------------------------------------

[filament_switch_sensor filament_sensor]
pause_on_runout: True
switch_pin: PB4
runout_gcode:
    M118 Filamento ausente. Impressao pausada.
insert_gcode:
    M118 Filamento detectado.


# -----------------------------------------------------------------------------
# Malha da mesa e Input Shaper
# -----------------------------------------------------------------------------

[bed_mesh]
speed: 180
horizontal_move_z: 5
mesh_min: 30,30
mesh_max: 205,205
probe_count: 9,9
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
# Margem extra (mm) ao redor da peca no modo adaptativo:
adaptive_margin: 5

[input_shaper]
shaper_type_y: mzv
shaper_freq_y: 38.2
shaper_type_x: ei
shaper_freq_x: 79.6

# Compensacao de torcao do eixo X (a sonda indutiva fica deslocada -28.5mm do
# bico, entao a leitura muda se o portico estiver levemente torto). Descomente,
# rode CALIBRATE_AXIS_TWIST e depois SAVE_CONFIG. Se nao usar, deixe comentado.
#[axis_twist_compensation]
#calibrate_start_x: 35
#calibrate_end_x: 200
#calibrate_y: 117.5


# -----------------------------------------------------------------------------
# Cartao virtual
# -----------------------------------------------------------------------------
# NAO coloque [virtual_sdcard] aqui. O app injeta a secao sozinho com o caminho
# certo da instancia atual (logo acima do bloco SAVE_CONFIG). Um path fixo aqui
# quebra quando voce recria/troca a impressora e gera o aviso do Moonraker
# "GCode path received from Klipper does not match expected location".
# Se aparecer esse aviso mesmo assim, use exatamente o path que o Moonraker
# mostra no texto do aviso.


# =============================================================================
#  MACROS
# =============================================================================

# --- Compatibilidade Marlin -------------------------------------------------

[gcode_macro M118]
description: Compatibilidade para mensagens M118
gcode:
    {% if rawparams %}
        {action_respond_info(rawparams)}
    {% endif %}

[gcode_macro M420]
description: Carrega a malha default salva (compat Marlin)
gcode:
    BED_MESH_PROFILE LOAD=default

[gcode_macro M900]
description: "Marlin K-factor -> pressure_advance. Ex: M900 K0.04"
gcode:
    {% set k = params.K|default(0)|float %}
    SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE={k}

[gcode_macro M600]
description: Troca de filamento (pausa, descarrega e espera)
gcode:
    {% set X = params.X|default(10)|float %}
    {% set Y = params.Y|default(220)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    {% if printer.extruder.can_extrude|lower == "true" %}
        M83
        G1 E-2 F1800
        G1 E-70 F900
    {% endif %}
    M118 Filamento descarregado. Insira o novo e use RESUME (ou LOAD_FILAMENT).
    M300 S1500 P120
    RESTORE_GCODE_STATE NAME=M600_state


# --- Inicio / fim de impressao -------------------------------------------

[gcode_macro PRINT_START]
description: "Chamar no slicer: PRINT_START EXTRUDER={temp} BED={temp} [MESH=adaptive|full|load|off] [SOAK=min]"
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set extruder = params.EXTRUDER|default(210)|float %}
    {% set mesh = params.MESH|default("adaptive")|lower %}
    {% set soak = params.SOAK|default(0)|float %}

    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET Z=0
    G90
    M83
    M104 S150                          ; bico morno (nao goteja) enquanto aquece a mesa
    M140 S{bed}
    M190 S{bed}                         ; espera a mesa

    {% if soak > 0 %}
        M118 Heat-soak de {soak} min...
        G4 P{ (soak * 60000)|int }
    {% endif %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    {% if mesh == "adaptive" %}
        {% if printer.exclude_object.objects %}
            M118 Bed mesh adaptativo ({printer.exclude_object.objects|length} objetos)
            BED_MESH_CALIBRATE ADAPTIVE=1
        {% else %}
            M118 Sem objetos definidos -> malha completa
            BED_MESH_CALIBRATE
        {% endif %}
    {% elif mesh == "full" %}
        BED_MESH_CALIBRATE
    {% elif mesh == "load" %}
        BED_MESH_PROFILE LOAD=default
    {% endif %}

    G1 X0 Y0 F6000
    M109 S{extruder}                    ; espera o bico

    # Linha de purga
    G92 E0
    G1 X2 Y10 Z0.3 F3000
    G1 X2 Y180 E14 F1200
    G1 X2.5 Y180 F3000
    G1 X2.5 Y10 E28 F1200
    G92 E0
    G1 Z2 F600
    M118 Impressao iniciada.

[gcode_macro PRINT_END]
description: Fim de impressao: desliga tudo, retrai e estaciona
gcode:
    {% set z_lift = 15.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set safe = [z_lift, max_z - cur_z]|min %}

    M400
    G92 E0
    {% if printer.extruder.can_extrude|lower == "true" %}
        M83
        G1 E-3 F1800
    {% endif %}
    {% if safe > 0 %}
        G91
        G1 Z{safe} F900
        G90
    {% endif %}
    G1 X0 Y220 F6000

    TURN_OFF_HEATERS
    M107
    BED_MESH_CLEAR
    M84
    M118 Impressao concluida.
    M300 S880 P150
    M300 S1320 P200


# --- Malha da mesa / sonda ------------------------------------------------

[gcode_macro ADAPTIVE_MESH]
description: Malha adaptativa manual (usa os objetos ja definidos)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %} G28 {% endif %}
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1

[gcode_macro FULL_BED_MESH]
description: Aquece a mesa, faz homing, calibra 9x9 e salva o perfil default
gcode:
    {% set bed = params.BED|default(60)|float %}
    M140 S{bed}
    M190 S{bed}
    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=default
    M118 Malha salva em [bed_mesh default]. Rode SAVE_CONFIG para gravar.

[gcode_macro G29]
description: Homing + malha 9x9 + salva perfil + SAVE_CONFIG (compat Marlin)
gcode:
    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=default
    SAVE_CONFIG
    # SAVE_CONFIG reinicia o Klipper aqui; nao coloque comandos depois.

[gcode_macro QUICK_MESH]
description: Malha temporaria, sem salvar nem reiniciar
gcode:
    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

[gcode_macro TEST_PROBE]
description: Homing e 10 medicoes de repetibilidade do probe
gcode:
    G28
    PROBE_ACCURACY SAMPLES=10

[gcode_macro CALIBRATE_PROBE_Z]
description: Aquece, faz homing e inicia PROBE_CALIBRATE (use TESTZ / ACCEPT)
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set hot = params.EXTRUDER|default(0)|float %}
    M140 S{bed}
    M190 S{bed}
    {% if hot > 0 %} M104 S{hot} {% endif %}
    G28
    {% if hot > 0 %} M109 S{hot} {% endif %}
    PROBE_CALIBRATE
    M118 Use TESTZ Z=-0.05 (ou +) ate encostar. Depois ACCEPT.

[gcode_macro APPLY_Z_OFFSET]
description: Grava o offset Z ao vivo dentro do probe.z_offset (Z_OFFSET_APPLY_PROBE)
gcode:
    Z_OFFSET_APPLY_PROBE
    SAVE_CONFIG

[gcode_macro PAPER_TEST]
description: Calibracao de Z-offset com folha de papel
gcode:
    G28
    PROBE_CALIBRATE
    M118 Use TESTZ para ajustar. Finalize com ACCEPT ou ABORT.

[gcode_macro CALIBRATE_AXIS_TWIST]
description: Calibra a compensacao de torcao do eixo (offset da sonda indutiva)
gcode:
    M118 Requer a secao [axis_twist_compensation] no config. Aquecendo e iniciando...
    {% set bed = params.BED|default(60)|float %}
    M140 S{bed}
    M190 S{bed}
    G28
    AXIS_TWIST_COMPENSATION_CALIBRATE


# --- Babystepping / offset ao vivo --------------------------------------

[gcode_macro Z_DOWN]
description: Abaixa o bico 0.01mm (mais perto da mesa) durante a impressao
gcode:
    SET_GCODE_OFFSET Z_ADJUST=-0.010 MOVE=1

[gcode_macro Z_UP]
description: Levanta o bico 0.01mm durante a impressao
gcode:
    SET_GCODE_OFFSET Z_ADJUST=0.010 MOVE=1


# --- Ajustes de velocidade / PA (Klipper 0.13) -------------------------

[gcode_macro SPEED_LIMIT]
description: "Define VEL/ACCEL/SCV/MCR e opcionalmente testa passo perdido. Ex: SPEED_LIMIT VEL=250 ACCEL=2500 SCV=8 MCR=0.5 TEST=1"
gcode:
    {% set v     = params.VEL|default(printer.toolhead.max_velocity)|float %}
    {% set a     = params.ACCEL|default(printer.toolhead.max_accel)|float %}
    {% set scv   = params.SCV|default(printer.toolhead.square_corner_velocity)|float %}
    {% set mcr   = params.MCR|default(printer.toolhead.minimum_cruise_ratio)|float %}
    {% set test  = params.TEST|default(0)|int %}
    {% set iters = params.ITERATIONS|default(3)|int %}

    SET_VELOCITY_LIMIT VELOCITY={v} ACCEL={a} SQUARE_CORNER_VELOCITY={scv} MINIMUM_CRUISE_RATIO={mcr}
    M118 SPEED_LIMIT -> VEL={v} ACCEL={a} SCV={scv} MIN_CRUISE_RATIO={mcr}

    {% if test %}
        G28
        AUTO_SPEED_VALIDATE VELOCITY={v} ACCEL={a} SCV={scv} VALIDATE_ITERATIONS={iters}
    {% endif %}

[gcode_macro SET_PA]
description: "Define pressure advance. Ex: SET_PA ADVANCE=0.035 [SMOOTH=0.04]"
gcode:
    {% set a = params.ADVANCE|default(0)|float %}
    {% set s = params.SMOOTH|default(0.040)|float %}
    SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE={a} SMOOTH_TIME={s}
    M118 pressure_advance={a} smooth_time={s}

[gcode_macro CALIBRATE_PA]
description: TUNING_TOWER para pressure advance. Rode com uma peca fina no slicer.
gcode:
    {% set start = params.START|default(0.0)|float %}
    {% set factor = params.FACTOR|default(0.005)|float %}
    SET_PRESSURE_ADVANCE EXTRUDER=extruder ADVANCE={start}
    TUNING_TOWER COMMAND=SET_PRESSURE_ADVANCE PARAMETER=ADVANCE START={start} FACTOR={factor}
    M118 PA sobe {factor}/mm a partir de {start}. Meça a altura da melhor faixa: PA = START + FACTOR*altura.

[gcode_macro TEST_SPEED]
description: "Teste de velocidade/aceleracao com medicao real de passo perdido. Ex: TEST_SPEED SPEED=300 ACCEL=5000 ITERATIONS=5"
gcode:
    {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set bound = params.BOUND|default(20)|int %}
    {% set orig_mcr = printer.toolhead.minimum_cruise_ratio %}

    SAVE_GCODE_STATE NAME=TEST_SPEED
    M118 TEST_SPEED: {speed}mm/s / {accel}mm/s^2 x{iterations} (pior caso, MCR=0)
    G28
    SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO=0
    AUTO_SPEED_VALIDATE VELOCITY={speed} ACCEL={accel} VALIDATE_ITERATIONS={iterations} VALIDATE_MARGIN={bound}
    SET_VELOCITY_LIMIT MINIMUM_CRUISE_RATIO={orig_mcr}
    RESTORE_GCODE_STATE NAME=TEST_SPEED


# --- Calibracoes PID ----------------------------------------------------

[gcode_macro MESH_CALIBRATE]
description: Aquece a mesa, faz homing e calibra a malha 9x9
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M140 S{BED_TEMP}
    M104 S150
    M118 Aquecendo mesa a {BED_TEMP} C...
    M190 S{BED_TEMP}
    M109 S150
    G28
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    M104 S0
    M118 Malha concluida. Execute SAVE_CONFIG para salvar.

[gcode_macro PID_HOTEND]
description: Calibra o PID do hotend. Ex: PID_HOTEND TARGET=240
gcode:
    {% set target = params.TARGET|default(240)|float %}
    {% if target < 170 or target > 260 %}
        {action_raise_error("Use uma temperatura entre 170 e 260 C")}
    {% endif %}
    M140 S0
    M106 S0
    M118 Calibrando PID do hotend a {target} C...
    PID_CALIBRATE HEATER=extruder TARGET={target}
    M104 S0
    SAVE_CONFIG

[gcode_macro PID_BED]
description: Calibra o PID da mesa. Ex: PID_BED TARGET=60
gcode:
    {% set target = params.TARGET|default(60)|float %}
    {% if target < 40 or target > 100 %}
        {action_raise_error("Use uma temperatura entre 40 e 100 C")}
    {% endif %}
    M104 S0
    M106 S0
    M118 Calibrando PID da mesa a {target} C...
    PID_CALIBRATE HEATER=heater_bed TARGET={target}
    M140 S0
    SAVE_CONFIG


# --- Cancelar / pausar / retomar --------------------------------------

[gcode_macro CANCEL_PRINT]
description: Cancela, retrai, sobe 50mm e estaciona em X=0
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set retract = 2.0 %}
    {% set z_lift = 50.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% if printer.extruder.can_extrude|lower == "true" %}
        M83
        G1 E-{retract} F1800
    {% endif %}
    {% if "z" in printer.toolhead.homed_axes %}
        {% set safe_lift = [z_lift, max_z - current_z]|min %}
        {% if safe_lift > 0 %}
            G91
            G1 Z{safe_lift} F900
            G90
        {% endif %}
    {% endif %}
    {% if "x" in printer.toolhead.homed_axes %}
        G90
        G1 X0 F6000
    {% endif %}
    M107
    TURN_OFF_HEATERS
    BED_MESH_CLEAR
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    CANCEL_PRINT_BASE

[gcode_macro PAUSE]
description: Pausa, retrai e estaciona o cabecote
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
    {% set extrude = params.E|default(printer["gcode_macro PAUSE"].extrude)|float %}
    {% set z_lift = 10.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set current_z = printer.toolhead.position.z|float %}
    PAUSE_BASE
    {% if printer.extruder.can_extrude|lower == "true" %}
        M83
        G1 E-{extrude} F1800
    {% endif %}
    {% if "z" in printer.toolhead.homed_axes %}
        {% set safe_lift = [z_lift, max_z - current_z]|min %}
        {% if safe_lift > 0 %}
            G91
            G1 Z{safe_lift} F900
            G90
        {% endif %}
    {% endif %}
    {% if "xy" in printer.toolhead.homed_axes %}
        G90
        G1 X0 Y220 F6000
    {% endif %}

[gcode_macro RESUME]
description: Retoma a impressao pausada
rename_existing: RESUME_BASE
gcode:
    {% set extrude = printer["gcode_macro PAUSE"].extrude|float %}
    {% if "VELOCITY" in params|upper %}
        {% set velocity = "VELOCITY=" + params.VELOCITY %}
    {% else %}
        {% set velocity = "" %}
    {% endif %}
    {% if printer.extruder.can_extrude|lower == "true" %}
        M83
        G1 E{extrude} F1800
        RESUME_BASE {velocity}
    {% else %}
        {action_respond_info("Nao foi possivel retomar: aqueca o bico primeiro")}
        M118 Aqueca o bico antes de executar RESUME.
    {% endif %}


# --- Filamento ---------------------------------------------------------

[gcode_macro LOAD_FILAMENT]
description: Carrega filamento com o bico aquecido
gcode:
    {% if printer.extruder.can_extrude|lower == "true" %}
        SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
        M83
        G92 E0
        G1 E50 F300
        G1 E10 F120
        G92 E0
        RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
        M118 Filamento carregado.
    {% else %}
        {action_respond_info("Aqueca o bico antes de carregar o filamento")}
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Descarrega filamento com o bico aquecido
gcode:
    {% if printer.extruder.can_extrude|lower == "true" %}
        SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
        M83
        G92 E0
        G1 E5 F120
        G1 E-70 F900
        G92 E0
        RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
        M118 Filamento descarregado.
    {% else %}
        {action_respond_info("Aqueca o bico antes de descarregar o filamento")}
    {% endif %}


# --- Pre-aquecimento / resfriamento ----------------------------------

[gcode_macro PREHEAT_PLA]
description: Bico 210 C / mesa 60 C
gcode:
    M140 S60
    M104 S210
    M118 Preaquecendo para PLA.

[gcode_macro PREHEAT_PETG]
description: Bico 240 C / mesa 75 C
gcode:
    M140 S75
    M104 S240
    M118 Preaquecendo para PETG.

[gcode_macro PREHEAT_TPU]
description: Bico 225 C / mesa 50 C
gcode:
    M140 S50
    M104 S225
    M118 Preaquecendo para TPU.

[gcode_macro HEATSOAK]
description: "Aquece a mesa e espera N minutos. Ex: HEATSOAK BED=60 MIN=10"
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set minutes = params.MIN|default(10)|float %}
    M140 S{bed}
    M190 S{bed}
    M118 Heat-soak: {minutes} min a {bed} C...
    G4 P{ (minutes * 60000)|int }
    M118 Heat-soak concluido.

[gcode_macro COOLDOWN]
description: Desliga aquecedores e ventilador
gcode:
    TURN_OFF_HEATERS
    M107
    M118 Aquecedores e ventilador desligados.


# --- Utilidades ------------------------------------------------------

[gcode_macro PARK_HEAD]
description: Homing se necessario, levanta e estaciona em X=0
gcode:
    {% set z_lift = 10.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
        G90
        G1 Z10 F900
    {% else %}
        {% set safe_lift = [z_lift, max_z - current_z]|min %}
        {% if safe_lift > 0 %}
            G91
            G1 Z{safe_lift} F900
            G90
        {% endif %}
    {% endif %}
    G90
    G1 X0 F6000

[gcode_macro CENTER]
description: Move o bico para o centro da mesa (Z=10)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %} G28 {% endif %}
    G90
    G1 Z10 F600
    G1 X117.5 Y117.5 F6000

[gcode_macro STEPPERS_OFF]
description: Desliga todos os motores
gcode:
    M84

[gcode_macro LED_ON]
gcode:
    SET_PIN PIN=LED_Light VALUE=1

[gcode_macro LED_OFF]
gcode:
    SET_PIN PIN=LED_Light VALUE=0

[gcode_macro PARAMS]
description: Mostra limites atuais de movimento e offsets
gcode:
    {% set th = printer.toolhead %}
    M118 vel={th.max_velocity} accel={th.max_accel} scv={th.square_corner_velocity} mcr={th.minimum_cruise_ratio}
    M118 z_offset(probe)={printer.configfile.settings.probe.z_offset} live_offset={printer.gcode_move.homing_origin.z}
    M118 pressure_advance={printer.extruder.pressure_advance} smooth_time={printer.extruder.smooth_time}

[gcode_macro SHOW_WARNINGS]
description: Lista os avisos de configuracao do Klipper
gcode:
    {% for w in printer.configfile.warnings %}
        M118 {w.message}
    {% else %}
        M118 Sem avisos de configuracao.
    {% endfor %}

[gcode_macro HYPERLAPSE]
description: Compat com timelapse nao instalado
gcode:
    {action_respond_info("HYPERLAPSE ignorado: timelapse nao configurado")}


