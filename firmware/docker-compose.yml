# KlipPocket — MCU firmware builder (containerised)
#
# Run from the repo root:
#
#   # build the image once (pins Klipper v0.13.0 + ARM gcc 10.3-2021.07)
#   docker compose -f firmware/docker-compose.yml build
#
#   # build firmware for a board in firmware/configs/  ->  firmware/output/
#   docker compose -f firmware/docker-compose.yml run --rm fw elegoo-neptune3-pro
#
#   # list available boards
#   docker compose -f firmware/docker-compose.yml run --rm fw
#
#   # a different Klipper tag: rebuild the image with a build-arg
#   docker compose -f firmware/docker-compose.yml build --build-arg KLIPPER_TAG=v0.12.0
#
# Add your own board: drop a `make menuconfig` .config into firmware/configs/
# (optionally with "#!" directives — see scripts/build_firmware.sh header).
services:
  fw:
    build:
      context: ..
      dockerfile: firmware/Dockerfile
      args:
        KLIPPER_TAG: v0.13.0
        TOOLCHAIN_VERSION: 10.3-2021.07
    image: klippocket-firmware
    volumes:
      - ./configs:/configs:ro
      - ./output:/out
