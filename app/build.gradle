tasks.register('bundleKlipper') {
    doFirst {
        var assets = file('src/main/assets')
        var versionFile = new File(assets, 'bundle_version')
        var kalicoHash = file('src/main/kalico').exists() ? getGitCommitHash(file('src/main/kalico')) : 'none'
        var addonsVersionFile = file('src/main/assets/klipper/addons_version')
        var addonsVersion = addonsVersionFile.exists() ? addonsVersionFile.text.trim() : '0'
        var octoeverywhereVersion = file('src/main/octoeverywhere/vendor_version').exists() ? file('src/main/octoeverywhere/vendor_version').text.trim() : 'none'
        var obicoVersion = file('src/main/obico/vendor_version').exists() ? file('src/main/obico/vendor_version').text.trim() : 'none'
        var version = 'klipper-' + getGitCommitHash(file('src/main/klipper')) + '_kalico-' + kalicoHash + '_moonraker-' + getGitCommitHash(file('src/main/moonraker')) + '_happyhare-' + getGitCommitHash(file('src/main/happyhare')) + '_klipper_tmc_autotune-' + getGitCommitHash(file('src/main/klipper_tmc_autotune')) + '_moonraker_timelapse-' + getGitCommitHash(file('src/main/moonraker_timelapse')) + '_beamext-' + file('src/main/assets/klipper/beam_ext/ext_version').text + '_addons-' + addonsVersion + '_octoeverywhere-' + octoeverywhereVersion + '_obico-' + obicoVersion
        if (!versionFile.exists() || versionFile.text != version) {
            var files = new ArrayList<File>()
            collectFiles(file('src/main/assets/klipper/klippy'), files)
            collectFiles(file('src/main/assets/kalico/klippy'), files)
            collectFiles(file('src/main/assets/moonraker/moonraker'), files)
            collectFiles(file('src/main/assets/octoeverywhere'), files)
            collectFiles(file('src/main/assets/obico'), files)
            files.each {
                it.delete()
            }

            files.clear()

            var klippy = file('src/main/klipper/klippy')
            collectFiles(klippy, files)

            JSONArray arr = new JSONArray()
            files.each {
                var sub = it.getAbsolutePath().substring(klippy.getAbsolutePath().length() + 1).replace('\\', '/')
                if (sub.startsWith("chelper/") && !sub.endsWith("__init__.py")) return
                arr.put('klippy/' + sub)
                var f = new File(assets, 'klipper/klippy/' + sub)
                f.getParentFile().mkdirs()
                Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }

            files.clear()
            klippy = file('src/main/happyhare/extras')
            collectFiles(klippy, files)
            files.each {
                if (it.getName() == ".pylintrc") return

                var sub = it.getAbsolutePath().substring(klippy.getAbsolutePath().length() + 1).replace('\\', '/')
                arr.put('klippy/extras/' + sub)
                var f = new File(assets, 'klipper/klippy/extras/' + sub)
                f.getParentFile().mkdirs()
                Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }

            // Vendored Klipper add-on mods (pure-python extras, dormant until the
            // matching [section] is added to printer.cfg). See docs/mods/.
            ['klipper_tmc_autotune', 'klipper_led_effect', 'klipper_z_calibration',
             'klipper_auto_speed', 'klipper_print_recovery', 'klipper_beam_ext'].each { modName ->
                files.clear()
                klippy = file('src/main/' + modName)
                collectFiles(klippy, files)
                files.each {
                    if (!it.getName().endsWith(".py") && !it.getName().endsWith(".cfg")) return

                    var sub = it.getAbsolutePath().substring(klippy.getAbsolutePath().length() + 1).replace('\\', '/')
                    if (sub.startsWith(".") || sub.contains("/.")) return
                    arr.put('klippy/extras/' + sub)
                    var f = new File(assets, 'klipper/klippy/extras/' + sub)
                    f.getParentFile().mkdirs()
                    Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
            }

            files.clear()
            klippy = file('src/main/assets/klipper/beam_ext')
            collectFiles(klippy, files)
            files.each {
                if (it.getName() == "ext_version") return

                var sub = it.getAbsolutePath().substring(klippy.getAbsolutePath().length() + 1).replace('\\', '/')
                arr.put('beam_ext/' + sub)
                var f = new File(assets, 'klipper/beam_ext/' + sub)
                f.getParentFile().mkdirs()
                Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }

            files.clear()
            klippy = file('src/main/klipper/config')
            collectFiles(klippy, files)
            files.each {
                var sub = it.getAbsolutePath().substring(klippy.getAbsolutePath().length() + 1).replace('\\', '/')
                arr.put('config/' + sub)
                var f = new File(assets, 'klipper/config/' + sub)
                f.getParentFile().mkdirs()
                Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }

            JSONObject index = new JSONObject()
            index.put('klipper', arr)

            if (file('src/main/kalico/klippy').exists()) {
                arr = new JSONArray()
                klippy = file('src/main/kalico/klippy')
                files.clear()
                collectFiles(klippy, files)
                files.each {
                    var sub = it.getAbsolutePath().substring(klippy.getAbsolutePath().length() + 1).replace('\\', '/')
                    if (sub.startsWith(".") || sub.contains("/.")) return
                    if (sub.startsWith("chelper/") && !sub.endsWith("__init__.py")) return
                    arr.put('klippy/' + sub)
                    var f = new File(assets, 'kalico/klippy/' + sub)
                    f.getParentFile().mkdirs()
                    Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }

                files.clear()
                klippy = file('src/main/happyhare/extras')
                collectFiles(klippy, files)
                files.each {
                    if (it.getName() == ".pylintrc") return

                    var sub = it.getAbsolutePath().substring(klippy.getAbsolutePath().length() + 1).replace('\\', '/')
                    if (sub.startsWith(".") || sub.contains("/.")) return
                    arr.put('klippy/extras/' + sub)
                    var f = new File(assets, 'kalico/klippy/extras/' + sub)
                    f.getParentFile().mkdirs()
                    Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }

                ['klipper_tmc_autotune', 'klipper_led_effect', 'klipper_z_calibration',
                 'klipper_auto_speed', 'klipper_print_recovery', 'klipper_beam_ext'].each { modName ->
                    files.clear()
                    klippy = file('src/main/' + modName)
                    collectFiles(klippy, files)
                    files.each {
                        if (!it.getName().endsWith(".py") && !it.getName().endsWith(".cfg")) return

                        var sub = it.getAbsolutePath().substring(klippy.getAbsolutePath().length() + 1).replace('\\', '/')
                        if (sub.startsWith(".") || sub.contains("/.")) return
                        arr.put('klippy/extras/' + sub)
                        var f = new File(assets, 'kalico/klippy/extras/' + sub)
                        f.getParentFile().mkdirs()
                        Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
                    }
                }

                files.clear()
                klippy = file('src/main/assets/klipper/beam_ext')
                collectFiles(klippy, files)
                files.each {
                    if (it.getName() == "ext_version") return

                    var sub = it.getAbsolutePath().substring(klippy.getAbsolutePath().length() + 1).replace('\\', '/')
                    if (sub.startsWith(".") || sub.contains("/.")) return
                    arr.put('beam_ext/' + sub)
                    var f = new File(assets, 'kalico/beam_ext/' + sub)
                    f.getParentFile().mkdirs()
                    Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }

                index.put('kalico', arr)
            }

            arr = new JSONArray()
            arr.put('bootstrap.py')
            var moonraker = file('src/main/moonraker/moonraker')
            files.clear()
            collectFiles(moonraker, files)
            files.each {
                var sub = it.getAbsolutePath().substring(moonraker.getAbsolutePath().length() + 1).replace('\\', '/')
                arr.put('moonraker/' + sub)
                var f = new File(assets, 'moonraker/moonraker/' + sub)
                f.getParentFile().mkdirs()
                Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }

            // Moonraker reports its version from git / pip metadata / a version
            // file — the bundle is none of those, so /server/info returned
            // "Version: ?". Stamp moonraker/__version__.py (the path pdm-build
            // would generate) from 'moonraker_version', a plain marker file
            // (same idea as beam_ext/ext_version) updated by hand whenever the
            // vendored Moonraker source is re-synced. NOT derived from
            // docs/changelog.md: upstream stopped adding numbered "## [x.y.z]"
            // headings after 0.8.0 (2023) and has kept everything under
            // "## [Unreleased]" since, so parsing the changelog's top heading
            // always resolved to the stale "v0.8.0" regardless of how current
            // the actual vendored source was.
            var mrVersionFile = file('src/main/moonraker/moonraker_version')
            var mrVersion = mrVersionFile.exists() ? (mrVersionFile.text.trim() + '-beam') : 'v0.0.0-beam'
            var mrVerFile = new File(assets, 'moonraker/moonraker/__version__.py')
            mrVerFile.getParentFile().mkdirs()
            mrVerFile.text = "__version__ = '" + mrVersion + "'\n"
            arr.put('moonraker/__version__.py')

            moonraker = file('src/main/happyhare/components/')
            files.clear()
            collectFiles(moonraker, files)
            files.each {
                var sub = it.getAbsolutePath().substring(moonraker.getAbsolutePath().length() + 1).replace('\\', '/')
                arr.put('moonraker/components/' + sub)
                var f = new File(assets, 'moonraker/moonraker/components/' + sub)
                f.getParentFile().mkdirs()
                Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }

            arr.put('moonraker/components/timelapse.py')
            Files.copy(file('src/main/moonraker_timelapse/component/timelapse.py').toPath(), new File(assets, 'moonraker/moonraker/components/timelapse.py').toPath(), StandardCopyOption.REPLACE_EXISTING)

            arr.put('timelapse.cfg')
            Files.copy(file('src/main/moonraker_timelapse/klipper_macro/timelapse.cfg').toPath(), new File(assets, 'moonraker/timelapse.cfg').toPath(), StandardCopyOption.REPLACE_EXISTING)

            index.put('moonraker', arr)

            // OctoEverywhere companion (real vendored source, see docs). Copied
            // wholesale, unlike klipper/moonraker above, since it isn't filtered
            // to just klippy/moonraker component subfolders — RepoRootFolder
            // needs a real pyproject.toml at its root and moonraker_octoeverywhere
            // ships its own static/ web assets.
            arr = new JSONArray()
            var octoRoot = file('src/main/octoeverywhere')
            if (octoRoot.exists()) {
                files.clear()
                collectFiles(octoRoot, files)
                files.each {
                    if (it.getName() == 'vendor_version') return
                    var sub = it.getAbsolutePath().substring(octoRoot.getAbsolutePath().length() + 1).replace('\\', '/')
                    if (sub.startsWith('.') || sub.contains('/.')) return
                    arr.put(sub)
                    var f = new File(assets, 'octoeverywhere/' + sub)
                    f.getParentFile().mkdirs()
                    Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
                index.put('octoeverywhere', arr)
            }

            // Obico companion (real vendored source, see docs/obico.md). Also
            // copied wholesale like octoeverywhere above — it's a plain
            // Python package (moonraker_obico/), not filtered to a klippy/
            // moonraker component subfolder.
            arr = new JSONArray()
            var obicoRoot = file('src/main/obico')
            if (obicoRoot.exists()) {
                files.clear()
                collectFiles(obicoRoot, files)
                files.each {
                    if (it.getName() == 'vendor_version') return
                    var sub = it.getAbsolutePath().substring(obicoRoot.getAbsolutePath().length() + 1).replace('\\', '/')
                    if (sub.startsWith('.') || sub.contains('/.')) return
                    arr.put(sub)
                    var f = new File(assets, 'obico/' + sub)
                    f.getParentFile().mkdirs()
                    Files.copy(it.toPath(), f.toPath(), StandardCopyOption.REPLACE_EXISTING)
                }
                index.put('obico', arr)
            }

            var indexFile = file('src/main/assets/index.json')
            if (!indexFile.exists()) indexFile.createNewFile()
            indexFile.text = index.toString()

            if (!versionFile.exists()) versionFile.createNewFile()
            versionFile.text = version
        }

        // Flat, runtime-readable markers of the exact upstream commit each
        // rolling-repo vendor tree (no real releases) was last synced to —
        // read by FrontendUpdateChecker for the Settings "current vs.
        // latest" display. Copied unconditionally (not gated by the version
        // check above) since getGitCommitHash() on these dirs resolves to
        // this repo's own HEAD, not a real per-tree staleness signal, and a
        // single-line text copy is too cheap to bother caching.
        var klipperCommitFile = file('src/main/klipper/klipper_commit')
        new File(assets, 'klipper_commit').text = klipperCommitFile.exists() ? klipperCommitFile.text.trim() : 'unknown'
        var moonrakerCommitFile = file('src/main/moonraker/moonraker_commit')
        new File(assets, 'moonraker_commit').text = moonrakerCommitFile.exists() ? moonrakerCommitFile.text.trim() : 'unknown'

        // Version tags shown in Settings and compared against the newest
        // upstream tag (Klipper3d/klipper, Arksine/moonraker). Plain marker
        // files updated by hand whenever the vendored source is re-synced.
        var klipperVersionFile = file('src/main/klipper/klipper_version')
        new File(assets, 'klipper_version').text = klipperVersionFile.exists() ? klipperVersionFile.text.trim() : 'unknown'
        var moonrakerVersionFile = file('src/main/moonraker/moonraker_version')
        new File(assets, 'moonraker_version').text = moonrakerVersionFile.exists() ? moonrakerVersionFile.text.trim() : 'unknown'
    }
}
tasks.getByName('preBuild').dependsOn('bundleKlipper')
tasks.getByName('preBuild').dependsOn('bundleFluidd')
tasks.getByName('preBuild').dependsOn('bundleMainsail')
tasks.getByName('preBuild').dependsOn('bundleVoyager')

// Line coverage of the unit tests: ./gradlew :app:jacocoUnitTestReport
// (report in app/build/reports/jacoco/jacocoUnitTestReport/html/index.html).
// Compose screens, generated code and the vendored NanoHTTPD are left out.
tasks.register('jacocoUnitTestReport', JacocoReport) {
    dependsOn 'testArm64DebugUnitTest'
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(fileTree(dir: "$buildDir/tmp/kotlin-classes/arm64Debug", excludes: [
        '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/*ComposableSingletons*',
        '**/ui/screens/**', '**/ui/theme/**', '**/ui/components/**', '**/ui/NavHost*', '**/ui/KlipApp*',
        '**/*\\$WhenMappings*', '**/*\\$Companion*'
    ]))
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(fileTree(dir: "$buildDir", includes: ['jacoco/testArm64DebugUnitTest.exec', 'outputs/unit_test_code_coverage/**/*.exec']))
}
