static String getGitCommitHash(File dir) {
    try {
        return Runtime.getRuntime().exec("git rev-parse HEAD", null, dir).inputStream.readLines().get(0).substring(0, 10)
    } catch (Exception e){
        println("Unable to get git commit hash:")
        e.printStackTrace()
        return "non-git build"
    }
}

static void collectFiles(File f, List<File> files) {
    // Never bundle Python bytecode caches. They are (a) machine/interpreter
    // specific, (b) gitignored so they slip in unnoticed after any local
    // `python`/`make menuconfig` run, and (c) silently dropped from the APK by
    // aapt2's default ignore pattern (any dir starting with "_"), which then
    // makes BundleInstaller.unpack() throw FileNotFoundException on device
    // because index.json still lists them -> no printer profiles load.
    def name = f.getName()
    if (name == '__pycache__' || name.endsWith('.pyc') || name.endsWith('.pyo')) {
        return
    }
    if (f.isDirectory()) {
        f.listFiles().each {
            collectFiles(it, files)
        }
    } else {
        files.add(f)
    }
}

def registerFrontendBundle(String taskName, String dirName, String versionProp, Closure<String> zipUrl) {
    tasks.register(taskName) {
        doFirst {
            var assets = file('src/main/assets')
            var versionFile = new File(assets, dirName + '_version')
            var configVersion = project.property(versionProp)

            if (versionFile.exists() && configVersion == versionFile.text.trim()) {
                return
            }

            var frontendDir = new File(assets, dirName)
            var files = new ArrayList<File>()
            collectFiles(frontendDir, files)
            files.each {
                it.delete()
            }

            def con = new URL(zipUrl(configVersion)).openConnection() as HttpURLConnection
            if (con.getResponseCode() == 200) {
                ZipInputStream zis = new ZipInputStream(con.getInputStream())
                ZipEntry entry
                byte[] buf = new byte[10240]
                int c

                while (entry = zis.getNextEntry()) {
                    File f = new File(frontendDir, entry.getName())
                    if (entry.isDirectory()) {
                        f.mkdirs()
                        continue
                    }

                    f.getParentFile().mkdirs()
                    var fos = new FileOutputStream(f)

                    while ((c = zis.read(buf)) != -1) {
                        fos.write(buf, 0, c)
                    }
                    fos.close()
                }
                zis.close()

                versionFile.text = configVersion
            } else {
                throw new IllegalStateException('Failed to download ' + dirName)
            }
        }
    }
}

